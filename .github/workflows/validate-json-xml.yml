name: Validate data files

on:
  workflow_call:

permissions:
  contents: read

jobs:
  data:
    name: JSON XML YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Parse JSON, XML and YAML
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          import yaml

          root = pathlib.Path('.')
          files = [
              p for p in root.rglob('*')
              if p.is_file() and '.git' not in p.parts and 'node_modules' not in p.parts
          ]

          json_files = [p for p in files if p.suffix.lower() == '.json']
          xml_files = [p for p in files if p.suffix.lower() in {'.xml', '.svg'}]
          yaml_files = [p for p in files if p.suffix.lower() in {'.yml', '.yaml'}]

          failures = []

          for path in json_files:
              try:
                  json.loads(path.read_text(encoding='utf-8-sig'))
              except Exception as exc:
                  failures.append(f'{path}: {exc}')

          for path in xml_files:
              try:
                  ET.parse(path)
              except Exception as exc:
                  failures.append(f'{path}: {exc}')

          for path in yaml_files:
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8-sig'))
              except Exception as exc:
                  failures.append(f'{path}: {exc}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)

          print(f'JSON: {len(json_files)}, XML: {len(xml_files)}, YAML: {len(yaml_files)}')
          PY
