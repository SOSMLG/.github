name: Validate PowerShell

on:
  workflow_call:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter *.ps1 -Force |
            Where-Object { $_.FullName -notmatch '[/\\]\.git[/\\]' }
          if (-not $files) {
            Write-Host 'No PowerShell files found.'
            exit 0
          }
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($error in $errors) {
                Write-Error "$($file.FullName): $($error.Message)"
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host "Parsed $($files.Count) PowerShell files."
