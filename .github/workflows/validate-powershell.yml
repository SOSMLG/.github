name: Validate PowerShell

on:
  workflow_call:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter *.ps1 -Force |
            Where-Object { $_.FullName -notmatch '[/\\]\.git[/\\]' }
          if (-not $files) {
            Write-Host 'No PowerShell files found.'
            exit 0
          }
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($error in $errors) {
                Write-Error "$($file.FullName): $($error.Message)"
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host "Parsed $($files.Count) PowerShell files."

      - name: Conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<< |=======$|>>>>>>> )' --exclude-dir=.git .; then
            echo "Conflict marker found." >&2
            exit 1
          fi
          echo "No conflict markers."

      - name: Whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi
          echo "Whitespace check complete."
